apiVersion: 1
datasources:
  - name: EcoSense
    uid: ecosense-pg
    type: grafana-postgresql-datasource
    url: db:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: $PG_DB
      sslmode: disable
      timescaledb: true
      postgresVersion: 1700
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
